<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GreenVeil</title>
    <meta name="description" content="A gamified Robinhood Chain token and NFT world.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
      /* Ensure x-login-preview panel and elements are 100% visible on load */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #17241c !important;
      }

      .x-login-preview {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 280px;
        overflow: hidden;
        background-color: #17241c !important;
        color: #f6ecd2;
        isolation: isolate;
        opacity: 1 !important;
        visibility: visible !important;
      }

      .x-login-static-background {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        background-image: url('ui/x-login/removed2.webp') !important;
        background-position: 52.5% 57.5% !important;
        background-repeat: no-repeat !important;
        background-size: cover !important;
        opacity: 1 !important;
        transform: scale(1.02);
      }

      .x-login-panel {
        position: relative;
        z-index: 2;
        transform: scale(1) !important;
        opacity: 1 !important;
        visibility: visible !important;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }

      .fox-dialogue {
        opacity: 1 !important;
        pointer-events: auto !important;
        visibility: visible !important;
      }
    </style>
</head>
<body>

    <!-- X Login Surface (100% Matching Screenshot & Assets) -->
    <section class="x-login-preview" role="dialog" aria-modal="true" aria-labelledby="x-login-preview-title" id="x-login-surface">
        <div class="x-login-static-background" aria-hidden="true"></div>
        
        <div class="x-login-fox-stage" aria-hidden="true">
            <canvas class="x-login-fox-canvas" id="fox-canvas"></canvas>
        </div>

        <!-- Dialogue Speech Bubble (Matching Screenshot 1:1) -->
        <div class="fox-dialogue x-login-fox-dialogue is-open" role="status" aria-live="polite" style="top: 45%; left: 72%;">
            <span class="fox-dialogue__kicker">FOX.EXE</span>
            <span class="fox-dialogue__text" id="fox-dialogue-text">I've seen rugs with stronger communities.</span>
        </div>

        <div class="x-login-auth-error" role="alert" aria-live="assertive" hidden>
            <span class="x-login-auth-error__icon" aria-hidden="true">!</span>
            <span class="x-login-auth-error__content">
                <strong>X CONNECTION FAILED</strong>
                <span class="x-login-auth-error__copy">We could not verify your X account. Please try again.</span>
            </span>
        </div>

        <!-- Central Wooden Login Panel -->
        <div class="x-login-panel">
            <div class="x-login-crest" aria-hidden="true">
                <svg viewBox="0 0 132 82">
                    <path class="crest-arrow is-left" d="m13 62 38-42M12 62l6-2-4-5m37-35-9 2 7 6"/>
                    <path class="crest-arrow is-right" d="m119 62-38-42m39 42-6-2 4-5M81 20l9 2-7 6"/>
                    <path class="crest-leaf is-left" d="M63 69C39 62 31 45 34 24c21 5 32 21 29 45Z"/>
                    <path class="crest-leaf is-right" d="M69 69c24-7 32-24 29-45-21 5-32 21-29 45Z"/>
                    <path class="crest-leaf is-center" d="M66 68c-13-19-10-39 0-56 12 17 15 37 0 56Z"/>
                    <path class="crest-vein" d="M66 67V24M61 57 43 35m28 22 18-22"/>
                </svg>
            </div>

            <header class="x-login-brand">
                <h1 id="x-login-preview-title" style="font-family: 'Amatic SC', Georgia, serif; font-size: 58px; font-weight: 700; color: #F6ECD2; margin: 0;">GREENVEIL</h1>
            </header>

            <div class="x-login-divider" aria-hidden="true">
                <i></i><span><b></b><b></b><b></b></span><i></i>
            </div>

            <div class="x-login-button-frame">
                <button class="x-login-button" type="button" aria-label="Login with X" onclick="triggerXLogin()">
                    <svg class="x-login-x-mark" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/>
                    </svg>
                    <span>LOGIN WITH X</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Main Game Engine Elements -->
    <div class="game" id="main-game-hud" style="display: block;">
      <canvas class="js-canvas"></canvas>

      <aside class="js-fps-counter fps-counter">
        <output class="js-fps-counter-value fps-counter-value">60</output>
        <span class="fps-counter-label">FPS</span>
        <button class="js-fps-quality-toggle fps-quality-toggle" type="button">
          <span class="js-fps-quality-value">HIGH</span>
        </button>
      </aside>

      <!-- World Controls -->
      <nav class="js-world-hud-controls world-hud-controls has-settings-control">
        <button class="js-world-hud-profile world-hud-control is-profile" type="button">
          <span class="js-world-hud-profile-handle">Profile</span>
        </button>
        <button class="js-world-hud-leaderboard world-hud-control" type="button">
          <span>Leaderboard</span>
        </button>
        <button class="js-world-catalog-trigger world-hud-control is-catalog" type="button">
          <span>Catalog</span>
        </button>
      </nav>
    </div>

    <script src="app.js"></script>
    <script>
      const quotes = [
        "I've seen rugs with stronger communities.",
        "Robinhood Chain speed is unmatched.",
        "Vault timber, switch lanes.",
        "Beware of goblins at the roots.",
        "Founders Round is now active."
      ];

      let qIdx = 0;
      setInterval(() => {
        qIdx = (qIdx + 1) % quotes.length;
        const textElem = document.getElementById('fox-dialogue-text');
        if (textElem) textElem.innerText = quotes[qIdx];
      }, 4500);

      function triggerXLogin() {
        const surface = document.getElementById('x-login-surface');
        surface.style.opacity = '0';
        surface.style.transition = 'opacity 0.5s ease';
        setTimeout(() => {
          surface.style.display = 'none';
          alert('Verified Robinhood Chain Wallet! Logged in as @RobinHood_Hunter');
        }, 500);
      }
    </script>
</body>
</html>
